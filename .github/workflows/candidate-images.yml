name: Build candidate images

on:
  push:
    branches: [fix/idempotent-span-accounting]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'kirilligum/lmnr'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, app-server]
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source and builder
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker version
          docker buildx version
          docker buildx create --name candidate --driver docker-container --use

      - name: Authenticate candidate registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish immutable candidate
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/lmnr-${COMPONENT}"
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --push \
            --provenance=mode=max \
            --metadata-file image-metadata.json \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_APP_VERSION=candidate-${GITHUB_SHA}" \
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}" \
            --tag "${image}:candidate-${GITHUB_SHA}" \
            --file "${COMPONENT}/Dockerfile" \
            "${COMPONENT}"
          digest=$(jq -er '."containerimage.digest"' image-metadata.json)
          printf '%s@%s\n' "$image" "$digest" > image-reference.txt
          printf 'Candidate source: `%s`\n\nImage: `%s@%s`\n' "$GITHUB_SHA" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain source and image identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.component }}-${{ github.sha }}
          path: |
            image-metadata.json
            image-reference.txt
          if-no-files-found: error
          retention-days: 30
